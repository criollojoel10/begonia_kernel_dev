name: 🔧 Build DroidSpaces Kernel (begonia)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig target'
        required: false
        default: 'begonia_user_defconfig'
      branch:
        description: 'Branch to build'
        required: false
        default: 'droidspaces'
      kernel_version:
        description: 'Kernel version label'
        required: false
        default: '4.14.356-droidspaces'

env:
  DEFCONFIG: begonia_user_defconfig
  ARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CC: gcc
  KERNEL_VERSION: 4.14.356-droidspaces

jobs:
  build-kernel:
    name: Build kernel for begonia
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'droidspaces' }}
          fetch-depth: 1

      - name: Install toolchain and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross \
            device-tree-compiler \
            lz4 xz-utils zstd \
            cpio \
            bc bison flex \
            libssl-dev \
            python3 \
            --no-install-recommends
          sudo apt-get clean

      - name: Verify toolchain
        run: |
          aarch64-linux-gnu-gcc --version
          echo "=== CC test ==="
          echo 'int main(){return 0;}' | aarch64-linux-gnu-gcc -x c - -o /dev/null && echo "OK" || echo "FAIL"

      - name: Configure kernel
        run: |
          make ${{ env.DEFCONFIG }}
          echo "=== DroidSpaces config check ==="
          grep -E "TMPFS_POSIX_ACL|TMPFS_XATTR|NAMESPACES|PID_NS|SECCOMP|CGROUPS|DEVTMPFS|OVERLAY_FS|NET_NS|VETH|BRIDGE|NF_NAT" .config | grep -v "^#" | head -20

      - name: Build kernel
        run: |
          make -j$(nproc --all) Image dtbs 2>&1 | tee build.log
        env:
          LOCALVERSION: -droidspaces-v1

      - name: Build boot.img (Android boot image)
        run: |
          # Build boot image with AnyKernel3 or manual
          mkdir -p output
          cp arch/arm64/boot/Image output/Image
          cp arch/arm64/boot/dts/mediatek/*begonia*.dtb output/ 2>/dev/null || true
          ls -lh output/

      - name: Package artifacts
        run: |
          mkdir -p artifact
          cp output/Image artifact/
          find output/ -name "*.dtb" -exec cp {} artifact/ \;
          cp .config artifact/build.config
          cp build.log artifact/ 2>/dev/null || true
          cd artifact && tar -czf ../begonia-droidspaces-kernel.tar.gz *

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: begonia-droidspaces-kernel
          path: begonia-droidspaces-kernel.tar.gz
          retention-days: 90

      - name: Build summary
        run: |
          echo "## ✅ DroidSpaces Kernel Build Complete" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> \$GITHUB_STEP_SUMMARY
          echo "|---|---|" >> \$GITHUB_STEP_SUMMARY
          echo "| **Device** | Xiaomi Redmi Note 8 Pro (begonia) |" >> \$GITHUB_STEP_SUMMARY
          echo "| **Kernel** | ${{ env.KERNEL_VERSION }} |" >> \$GITHUB_STEP_SUMMARY
          echo "| **Defconfig** | ${{ env.DEFCONFIG }} |" >> \$GITHUB_STEP_SUMMARY
          echo "| **Branch** | ${{ inputs.branch || 'droidspaces' }} |" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "### Artifacts" >> \$GITHUB_STEP_SUMMARY
          echo "- \`Image\` - Kernel image (uncompressed)" >> \$GITHUB_STEP_SUMMARY
          echo "- \`*.dtb\` - Device tree blobs" >> \$GITHUB_STEP_SUMMARY
          echo "- \`build.config\` - Build configuration used" >> \$GITHUB_STEP_SUMMARY
          echo "" >> \$GITHUB_STEP_SUMMARY
          echo "### Flashing" >> \$GITHUB_STEP_SUMMARY
          echo '```bash' >> \$GITHUB_STEP_SUMMARY
          echo '# Flash via fastboot' >> \$GITHUB_STEP_SUMMARY
          echo 'fastboot flash boot boot.img' >> \$GITHUB_STEP_SUMMARY
          echo 'fastboot reboot' >> \$GITHUB_STEP_SUMMARY
          echo '```' >> \$GITHUB_STEP_SUMMARY
