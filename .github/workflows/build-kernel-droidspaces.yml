name: 🔧 Build DroidSpaces Kernel (begonia)

on:
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig'
        required: false
        default: 'begonia_user_defconfig'
      branch:
        description: 'Branch'
        required: false
        default: 'droidspaces'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'droidspaces' }}
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            libc6-dev-arm64-cross device-tree-compiler lz4 xz-utils zstd cpio \
            bc bison flex libssl-dev --no-install-recommends

      - name: Configure
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- ${{ inputs.defconfig || 'begonia_user_defconfig' }}
          grep -E "TMPFS_POSIX_ACL|TMPFS_XATTR|NAMESPACES|PID_NS|SECCOMP|CGROUPS|NET_NS|VETH" .config | grep -v "^#" | head -20

      - name: Build
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- -j$(nproc --all) all 2>&1 | tee build.log
          echo "=== Produced files ==="
          ls -lh arch/arm64/boot/Image* arch/arm64/boot/zImage* vmlinux 2>/dev/null || echo "(checking...)"
          find . -name "*.dtb" -not -path "./.git/*" | head -10

      - name: Package
        run: |
          mkdir -p output
          # Find kernel - MTK arm64 default is Image.gz
          for f in arch/arm64/boot/Image.gz-dtb arch/arm64/boot/Image.gz \
                    arch/arm64/boot/Image arch/arm64/boot/zImage vmlinux; do
            if [ -f "$f" ]; then
              cp "$f" output/
              echo "Kernel: $f ($(ls -lh $f | awk '{print $5}'))"
              break
            fi
          done
          # DTBs
          find . -name "*.dtb" -not -path "./.git/*" -exec cp {} output/ \;
          cp .config output/ 2>/dev/null || true
          cp build.log output/ 2>/dev/null || true
          ls -lh output/
          cd output && tar -czf ../kernel.tar.gz *

      - uses: actions/upload-artifact@v4
        with:
          name: begonia-droidspaces-kernel
          path: kernel.tar.gz
          retention-days: 90
