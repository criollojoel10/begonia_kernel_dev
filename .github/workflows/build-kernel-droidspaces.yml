name: "🔧 DroidSpaces Kernel — begonia (MTK)"

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: "Branch del kernel"
        required: false
        default: "droidspaces"
      defconfig:
        description: "Defconfig"
        required: false
        default: "begonia_user_defconfig"
      tag:
        description: "Tag del artifact"
        required: false
        default: "Droidspaces-v1"

env:
  ARCH: arm64
  SUBARCH: arm64
  OUT_DIR: out
  DEVICE: begonia
  CLANG_VERSION: clang-r547379

jobs:
  build-kernel:
    name: "Build DroidSpaces — begonia (MT6785)"
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: "Checkout kernel"
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.kernel_branch || 'droidspaces' }}
          fetch-depth: 1
          path: kernel

      - name: "Free disk + swap"
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          SWAPFILE=/mnt/kbuild-swap
          if ! swapon --show | grep -q "$SWAPFILE"; then
            sudo fallocate -l 8G "$SWAPFILE" || sudo dd if=/dev/zero of="$SWAPFILE" bs=1M count=8192
            sudo chmod 600 "$SWAPFILE" && sudo mkswap "$SWAPFILE" && sudo swapon "$SWAPFILE"
          fi
          df -h / | tail -1
          free -h | grep -E "Mem|Swap"

      - name: "Install deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses6 cpio lz4 zstd xz-utils \
            ccache python3 python-is-python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi device-tree-compiler

      - name: "Cache Clang"
        id: cache-clang
        uses: actions/cache@v4
        with:
          path: clang
          key: aosp-clang-r547379-ubuntu-2204

      - name: "Download Clang"
        if: steps.cache-clang.outputs.cache-hit != 'true'
        run: |
          mkdir -p clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          clang/bin/clang --version | head -2

      - name: "Create DroidSpaces config fragment"
        working-directory: kernel
        run: |
          mkdir -p arch/arm64/configs/vendor
          cat > arch/arm64/configs/vendor/droidspaces.config << 'CFG'
# === Namespaces ===
CONFIG_NAMESPACES=y
CONFIG_NSFS=y
CONFIG_PID_NS=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_NET_NS=y
# === Seccomp ===
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
# === Cgroups ===
CONFIG_CGROUPS=y
CONFIG_CGROUP_DEVICE=y
CONFIG_CGROUP_PIDS=y
CONFIG_MEMCG=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CGROUP_FREEZER=y
CONFIG_CGROUP_NET_PRIO=y
CONFIG_CGROUP_CPUACCT=y
CONFIG_BLK_CGROUP=y
# === Devtmpfs ===
CONFIG_DEVTMPFS=y
CONFIG_DEVTMPFS_MOUNT=y
# === Filesystems ===
CONFIG_OVERLAY_FS=y
CONFIG_TMPFS_XATTR=y
CONFIG_TMPFS_POSIX_ACL=y
CONFIG_DEVPTS_MULTIPLE_INSTANCES=y
CONFIG_BLK_DEV_LOOP=y
# === Network ===
CONFIG_VETH=y
CONFIG_TUN=y
CONFIG_BRIDGE=y
CONFIG_BRIDGE_NETFILTER=y
# === Netfilter ===
CONFIG_NETFILTER=y
CONFIG_NF_CONNTRACK=y
CONFIG_IP_NF_IPTABLES=y
CONFIG_IP_NF_FILTER=y
CONFIG_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_TARGET_MASQUERADE=y
CONFIG_NETFILTER_XT_MATCH_ADDRTYPE=y
# === Android ===
CONFIG_ANDROID_PARANOID_NETWORK=n
CFG
          echo "=== DroidSpaces config fragment ==="
          cat arch/arm64/configs/vendor/droidspaces.config

      - name: "Configure kernel"
        working-directory: kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}" \
          make O="${OUT_DIR}" ARCH=arm64 \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            ${{ inputs.defconfig || 'begonia_user_defconfig' }}

          # Merge DroidSpaces config fragment
          scripts/kconfig/merge_config.sh -m -O "${OUT_DIR}" \
            "${OUT_DIR}/.config" \
            arch/arm64/configs/vendor/droidspaces.config

          PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}" \
          make O="${OUT_DIR}" ARCH=arm64 \
            CC=clang LD=ld.lld \
            CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            olddefconfig

          # Verify
          echo "=== DroidSpaces config verification ==="
          CFG="${OUT_DIR}/.config"
          FAIL=0
          for opt in NAMESPACES PID_NS NET_NS CGROUPS MEMCG DEVTMPFS OVERLAY_FS \
                     TMPFS_XATTR SECCOMP SECCOMP_FILTER VETH BRIDGE NF_CONNTRACK; do
            if grep -q "^CONFIG_${opt}=y" "$CFG"; then
              echo "  OK: CONFIG_${opt}=y"
            else
              echo "  MISSING: CONFIG_${opt}"
              FAIL=1
            fi
          done
          if grep -q "^CONFIG_ANDROID_PARANOID_NETWORK=y" "$CFG"; then
            echo "  WARN: ANDROID_PARANOID_NETWORK=y (should be n)"
          else
            echo "  OK: ANDROID_PARANOID_NETWORK disabled"
          fi
          [ "$FAIL" -eq 0 ] || exit 1

      - name: "Build kernel"
        working-directory: kernel
        run: |
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export KBUILD_BUILD_USER="Joel"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}" \
          make O="${OUT_DIR}" ARCH=arm64 \
            CC="ccache clang" LD=ld.lld AR=llvm-ar NM=llvm-nm \
            OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 \
            -j$(nproc --all) Image.gz dtbs 2>&1 | tee build.log

          echo "=== Build result ==="
          ls -lh "${OUT_DIR}/arch/arm64/boot/"

      - name: "Package artifacts"
        run: |
          set -e
          mkdir -p output
          KD="${GITHUB_WORKSPACE}/kernel/${OUT_DIR}/arch/arm64/boot"

          # Kernel image
          if [ -f "$KD/Image.gz-dtb" ]; then
            cp "$KD/Image.gz-dtb" output/ && echo "Kernel: Image.gz-dtb ($(stat -c%s output/Image.gz-dtb) bytes)"
          elif [ -f "$KD/Image.gz" ]; then
            cp "$KD/Image.gz" output/ && echo "Kernel: Image.gz ($(stat -c%s output/Image.gz) bytes)"
          elif [ -f "$KD/Image" ]; then
            cp "$KD/Image" output/ && echo "Kernel: Image ($(stat -c%s output/Image) bytes)"
          else
            echo "ERROR: no kernel image found!"
            find "$KD" -maxdepth 2 -type f || true
            exit 1
          fi

          # DTBs
          DTB_COUNT=0
          while IFS= read -r dtb; do
            cp "$dtb" output/ && DTB_COUNT=$((DTB_COUNT+1))
          done < <(find "${GITHUB_WORKSPACE}/kernel/${OUT_DIR}/arch/arm64/boot/dts" -name "*.dtb" 2>/dev/null || true)
          echo "DTBs: ${DTB_COUNT}"

          # Config + build log
          cp "${GITHUB_WORKSPACE}/kernel/${OUT_DIR}/.config" output/ 2>/dev/null || true
          cp "${GITHUB_WORKSPACE}/kernel/build.log" output/ 2>/dev/null || true

          echo "=== Output ==="
          ls -lh output/
          cd output && tar -czf ../begonia-droidspaces-kernel.tar.gz .

      - name: "Upload artifact"
        uses: actions/upload-artifact@v4
        with:
          name: "begonia-droidspaces-kernel-${{ inputs.tag || 'latest' }}"
          path: begonia-droidspaces-kernel.tar.gz
          retention-days: 90
