name: "DroidSpaces Recovery Hack - begonia"

on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: "Run ID del kernel (vacio = ultimo success branch droidspaces)"
        required: false
        default: ""
      kernel_branch:
        description: "Branch del kernel"
        required: false
        default: "droidspaces"
      stock_recovery_run_id:
        description: "Run ID del stock recovery (vacio = ultimo success)"
        required: false
        default: ""

env:
  KERNEL_REPO: criollojoel10/begonia_kernel_dev
  RECOVERY_REPO: criollojoel10/begonia-lineage-builder
  EDITOR_REPO: Droidspaces/droidspaces-recovery-hack-example

jobs:
  build-recovery-hack:
    name: "Build DroidSpaces Recovery - begonia"
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: "Checkout droidspaces-recovery-hack-example"
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          path: editor
          fetch-depth: 1

      - name: "Setup Java 17"
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Install system deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            device-tree-compiler lz4 xz-utils zlib1g-dev python3 p7zip-full

      - name: "Resolve kernel run ID"
        id: kernel-run
        run: |
          if [ -n "${{ inputs.kernel_run_id }}" ]; then
            echo "run_id=${{ inputs.kernel_run_id }}" >> "$GITHUB_OUTPUT"
          else
            ID=$(gh run list -R $KERNEL_REPO \
              --workflow build-kernel.yml \
              --branch ${{ inputs.kernel_branch }} \
              --status success -L 1 \
              --json databaseId -q '.[0].databaseId')
            echo "run_id=$ID" >> "$GITHUB_OUTPUT"
            echo "--> Kernel run ID: $ID"
          fi

      - name: "Resolve stock recovery run ID"
        id: recovery-run
        run: |
          if [ -n "${{ inputs.stock_recovery_run_id }}" ]; then
            echo "run_id=${{ inputs.stock_recovery_run_id }}" >> "$GITHUB_OUTPUT"
          else
            ID=$(gh run list -R $RECOVERY_REPO \
              --workflow "05" \
              --status success -L 1 \
              --json databaseId -q '.[0].databaseId')
            echo "run_id=$ID" >> "$GITHUB_OUTPUT"
            echo "--> Stock recovery run ID: $ID"
          fi

      - name: "Download kernel artifact"
        run: |
          mkdir -p kernel-artifact
          gh run download -R $KERNEL_REPO \
            -n begonia-kernel \
            -D kernel-artifact \
            ${{ steps.kernel-run.outputs.run_id }}
          ls -lh kernel-artifact/

      - name: "Download stock recovery artifact"
        run: |
          mkdir -p stock-recovery
          gh run download -R $RECOVERY_REPO \
            -n begonia-stock-recovery \
            -D stock-recovery \
            ${{ steps.recovery-run.outputs.run_id }}
          ls -lh stock-recovery/

      - name: "Save example repo modified files"
        run: |
          mkdir -p /tmp/editor-mods
          cd editor
          for f in \
            build/unzip_boot/root/system/bin/droidspaces \
            build/unzip_boot/root/system/bin/recovery-console \
            build/unzip_boot/root/system/bin/boot-ubuntu.sh \
            build/unzip_boot/root/system/bin/selinux-permissive \
            build/unzip_boot/root/system/etc/init/init.ubuntu-droidspaces.example.rc \
            build/unzip_boot/root/system/etc/environment \
            build/unzip_boot/root/system/etc/init/init.recovery.usb.rc; do
            if [ -f "$f" ]; then
              mkdir -p "/tmp/editor-mods/$(dirname $f)"
              cp "$f" "/tmp/editor-mods/$f"
              echo "Saved: $f ($(stat -c%s "$f") bytes)"
            else
              echo "Not found: $f"
            fi
          done

      - name: "Unpack stock recovery"
        working-directory: ./editor
        run: |
          rm -f recovery.img *.img
          cp ../stock-recovery/recovery.img ./recovery.img
          ls -lh recovery.img
          ./gradlew unpack 2>&1
          echo "=== Post-unpack ==="
          ls -la build/unzip_boot/
          echo "---"
          ls build/unzip_boot/root/system/bin/ | head -15

      - name: "Inject DroidSpaces binaries and scripts"
        run: |
          ROOT=editor/build/unzip_boot/root
          MODS=/tmp/editor-mods/build/unzip_boot/root

          cp -v "$MODS/system/bin/droidspaces" "$ROOT/system/bin/" || echo "droidspaces binary missing"
          cp -v "$MODS/system/bin/recovery-console" "$ROOT/system/bin/" || echo "recovery-console missing"
          cp -v "$MODS/system/bin/boot-ubuntu.sh" "$ROOT/system/bin/" || echo "boot-ubuntu.sh missing"
          cp -v "$MODS/system/bin/selinux-permissive" "$ROOT/system/bin/" || echo "selinux-permissive missing"

          chmod 755 "$ROOT/system/bin/droidspaces" 2>/dev/null || true
          chmod 755 "$ROOT/system/bin/recovery-console" 2>/dev/null || true
          chmod 755 "$ROOT/system/bin/boot-ubuntu.sh" 2>/dev/null || true
          chmod 755 "$ROOT/system/bin/selinux-permissive" 2>/dev/null || true

          cp -v "$MODS/system/etc/environment" "$ROOT/system/etc/" || echo "environment missing"

          mkdir -p "$ROOT/system/etc/init"
          cp -v "$MODS/system/etc/init/init.recovery.usb.rc" "$ROOT/system/etc/init/" || echo "init.recovery.usb.rc missing"

          cp -v "$MODS/system/etc/init/init.ubuntu-droidspaces.example.rc" \
                "$ROOT/system/etc/init/init.ubuntu-droidspaces.rc" || \
          echo "ubuntu-droidspaces init missing"

          echo "=== Injected ==="
          ls -la "$ROOT/system/bin/droidspaces" "$ROOT/system/bin/recovery-console" \
                "$ROOT/system/bin/boot-ubuntu.sh" "$ROOT/system/bin/selinux-permissive" 2>/dev/null

      - name: "Replace kernel with DroidSpaces build"
        run: |
          mkdir -p kernel-out
          tar -xzf kernel-artifact/kernel.tar.gz -C kernel-out/ 2>/dev/null || {
            echo "kernel.tar.gz not found in artifact"
            ls -la kernel-artifact/
            exit 1
          }

          echo "=== Kernel artifact contents ==="
          ls -lh kernel-out/

          EDITOR_KERNEL=editor/build/unzip_boot/kernel
          echo "Stock kernel: $(stat -c%s "$EDITOR_KERNEL" 2>/dev/null || echo 'N/A') bytes"

          if [ -f kernel-out/Image.gz-dtb ]; then
            cp kernel-out/Image.gz-dtb "$EDITOR_KERNEL"
            echo "Replaced with Image.gz-dtb ($(stat -c%s "$EDITOR_KERNEL") bytes)"
          elif [ -f kernel-out/Image.gz ]; then
            cp kernel-out/Image.gz "$EDITOR_KERNEL"
            echo "Replaced with Image.gz ($(stat -c%s "$EDITOR_KERNEL") bytes)"
          elif [ -f kernel-out/Image ]; then
            cp kernel-out/Image "$EDITOR_KERNEL"
            echo "Replaced with Image ($(stat -c%s "$EDITOR_KERNEL") bytes)"
          else
            echo "No kernel image found!"
            find kernel-out/ -type f | head -20
            exit 1
          fi

          find kernel-out/ -name "*.dtb" -exec cp {} editor/build/unzip_boot/ \; 2>/dev/null || true
          echo "DTBs: $(find editor/build/unzip_boot/ -name '*.dtb' | wc -l)"

      - name: "Apply ramdisk modifications"
        run: |
          ROOT=editor/build/unzip_boot/root

          RC="$ROOT/system/etc/init/hw/init.rc"
          if [ ! -f "$RC" ]; then
            RC=$(find "$ROOT" -name "init.rc" -path "*/etc/init*" | head -1)
          fi
          echo "=== init.rc: $RC ==="

          if [ -f "$RC" ]; then
            cp "$RC" "$RC.stock"

            if ! grep -q "selinux-permissive" "$RC"; then
              sed -i '/^on init/a\    start selinux-permissive' "$RC"
              echo "Added start selinux-permissive"

              cat >> "$RC" << 'EOF'

service selinux-permissive /system/bin/selinux-permissive
    class core
    user root
    group root
    oneshot
    seclabel u:r:recovery:s0
EOF
              echo "Added selinux-permissive service"
            fi

            if grep -q "^service recovery " "$RC"; then
              sed -i '/^service recovery /a\    disabled' "$RC"
              echo "Disabled recovery UI"
            fi

            echo "init.rc changes applied"
          else
            echo "No init.rc found!"
          fi

          PROPDFLT="$ROOT/prop.default"
          if [ ! -f "$PROPDFLT" ]; then
            PROPDFLT=$(find "$ROOT" -name "prop.default" | head -1)
          fi

          if [ -f "$PROPDFLT" ]; then
            cp "$PROPDFLT" "$PROPDFLT.stock"
            for pair in \
              "ro.secure=0" \
              "ro.adb.secure=0" \
              "ro.debuggable=1" \
              "service.adb.root=1" \
              "ro.force.debuggable=1"; do
              key="${pair%%=*}"
              val="${pair#*=}"
              if grep -q "^${key}=" "$PROPDFLT"; then
                sed -i "s/^${key}=.*/${key}=${val}/" "$PROPDFLT"
              else
                echo "$pair" >> "$PROPDFLT"
              fi
            done
            echo "prop.default updated"
          else
            echo "No prop.default found"
          fi

          echo "Ramdisk modifications complete"

      - name: "Repack recovery image"
        working-directory: ./editor
        run: |
          rm -f recovery.img.signed recovery.img.clear recovery.img.google
          ./gradlew pack 2>&1
          echo "=== Output ==="
          ls -lh *.signed 2>/dev/null || echo "No .signed output"

      - name: "Upload DroidSpaces recovery"
        uses: actions/upload-artifact@v4
        with:
          name: begonia-droidspaces-recovery
          path: editor/recovery.img.signed
          retention-days: 90

      - name: "Upload debug info (on failure)"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-hack-debug
          path: |
            editor/build/unzip_boot/
            editor/recovery.img.*
            kernel-artifact/
            stock-recovery/
          retention-days: 14
