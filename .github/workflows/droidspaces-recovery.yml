name: "DroidSpaces Recovery Hack - begonia"

on:
  push:
    branches: [ "droidspaces-recovery" ]

env:
  KERNEL_RUN_ID: "28171150311"
  GH_PAT: "gho_BwyOfuPtL8Qu5e7bpqCa5cl6n"
  KERNEL_REPO: criollojoel10/begonia_kernel_dev
  RECOVERY_REPO: criollojoel10/begonia-lineage-builder
  RECOVERY_ARTIFACT_ID: 7869123359
  EDITOR_REPO: Droidspaces/droidspaces-recovery-hack-example

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.EDITOR_REPO }}
          path: editor
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Install deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            device-tree-compiler lz4 xz-utils zlib1g-dev python3 p7zip-full unzip

      - name: "Download kernel artifact (same repo)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ker
          echo "Downloading kernel run $KERNEL_RUN_ID..."
          gh run download -R $KERNEL_REPO -n begonia-kernel -D ker $KERNEL_RUN_ID
          ls -lh ker/

      - name: "Download stock recovery (cross-repo via PAT)"
        run: |
          mkdir -p rec
          echo "Downloading recovery artifact $RECOVERY_ARTIFACT_ID..."
          curl -sL -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/repos/$RECOVERY_REPO/actions/artifacts/$RECOVERY_ARTIFACT_ID/zip" \
            -o rec/recovery.zip
          ls -lh rec/recovery.zip
          unzip -o rec/recovery.zip -d rec/
          rm -f rec/recovery.zip
          ls -lh rec/

      - name: "Backup editor mods"
        run: |
          mkdir -p /tmp/mods
          cd editor
          for f in build/unzip_boot/root/system/bin/droidspaces \
            build/unzip_boot/root/system/bin/recovery-console \
            build/unzip_boot/root/system/bin/boot-ubuntu.sh \
            build/unzip_boot/root/system/bin/selinux-permissive \
            build/unzip_boot/root/system/etc/init/init.ubuntu-droidspaces.example.rc \
            build/unzip_boot/root/system/etc/environment \
            build/unzip_boot/root/system/etc/init/init.recovery.usb.rc; do
            [ -f "$f" ] && mkdir -p "/tmp/mods/$(dirname "$f")" && cp "$f" "/tmp/mods/$f"
          done

      - name: "Unpack"
        working-directory: ./editor
        run: |
          rm -f recovery.img; cp ../rec/recovery.img .; ls -lh recovery.img
          ./gradlew unpack 2>&1

      - name: "Inject DroidSpaces files"
        run: |
          R=editor/build/unzip_boot/root; M=/tmp/mods/build/unzip_boot/root
          for f in droidspaces recovery-console boot-ubuntu.sh selinux-permissive; do
            [ -f "$M/system/bin/$f" ] && cp -v "$M/system/bin/$f" "$R/system/bin/" && chmod 755 "$R/system/bin/$f" 2>/dev/null || true
          done
          cp -v "$M/system/etc/environment" "$R/system/etc/" || true
          mkdir -p "$R/system/etc/init"
          cp -v "$M/system/etc/init/init.recovery.usb.rc" "$R/system/etc/init/" || true
          cp -v "$M/system/etc/init/init.ubuntu-droidspaces.example.rc" \
                "$R/system/etc/init/init.ubuntu-droidspaces.rc" || true

      - name: "Replace kernel"
        run: |
          mkdir -p ko; tar -xzf ker/kernel.tar.gz -C ko/ 2>/dev/null || { echo "No kernel.tar.gz"; ls ker/; exit 1; }
          K=editor/build/unzip_boot/kernel
          for img in Image.gz-dtb Image.gz Image; do
            [ -f "ko/$img" ] && { cp "ko/$img" "$K"; echo "Kernel replaced: $img ($(stat -c%s '$K') bytes)"; break; }
          done
          [ -s "$K" ] || { find ko/ -type f | head -10; exit 1; }

      - name: "Modify ramdisk"
        run: |
          R=editor/build/unzip_boot/root
          RC=$(find "$R" -name init.rc -path '*/etc/init*' | head -1)
          [ -f "$RC" ] && {
            cp "$RC" "$RC.bak"
            grep -q 'selinux-permissive' "$RC" || {
              sed -i '/^on init/a\    start selinux-permissive' "$RC"
              echo -e '\nservice selinux-permissive /system/bin/selinux-permissive\n    class core\n    user root\n    group root\n    oneshot\n    seclabel u:r:recovery:s0' >> "$RC"
            }
            grep -q '^service recovery ' "$RC" && sed -i '/^service recovery /a\    disabled' "$RC"
          }
          PF=$(find "$R" -name prop.default | head -1)
          [ -f "$PF" ] && {
            cp "$PF" "$PF.bak"
            for kv in 'ro.secure=0' 'ro.adb.secure=0' 'ro.debuggable=1' \
                      'service.adb.root=1' 'ro.force.debuggable=1'; do
              k="${kv%%=*}"; v="${kv#*=}"
              grep -q "^${k}=" "$PF" && sed -i "s/^${k}=.*/${k}=${v}/" "$PF" || echo "$kv" >> "$PF"
            done
          }

      - name: "Repack"
        working-directory: ./editor
        run: |
          rm -f recovery.img.signed recovery.img.clear recovery.img.google
          ./gradlew pack 2>&1
          [ -f recovery.img.signed ] && ls -lh recovery.img.signed || {
            [ -f recovery.img.clear ] && { cp recovery.img.clear recovery.img.signed; ls -lh recovery.img.signed; } || echo "No output image!"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: begonia-droidspaces-recovery
          path: editor/recovery.img.signed
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug
          path: |
            editor/build/unzip_boot/
            editor/recovery.img.*
            ker/ rec/
          retention-days: 14
