name: "DroidSpaces Recovery Hack - begonia"

on:
  workflow_dispatch:
  push:
    branches: [ "droidspaces-recovery" ]

env:
  KERNEL_RUN_ID: "28171150311"
  RECOVERY_RUN_ID: "28147575684"
  RECOVERY_ARTIFACT_ID: "7869123359"
  KERNEL_REPO: criollojoel10/begonia_kernel_dev
  RECOVERY_OTHER_REPO: criollojoel10/begonia-lineage-builder
  GH_PAT: ${{ secrets.GH_PAT }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      # ── Editor (Android_boot_image_editor) ──
      - uses: actions/checkout@v4
        with:
          repository: cfig/Android_boot_image_editor
          path: editor
          fetch-depth: 1

      # ── Example repo for droidspaces binaries ──
      - uses: actions/checkout@v4
        with:
          repository: Droidspaces/droidspaces-recovery-hack-example
          path: example
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: "Install deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            device-tree-compiler lz4 xz-utils zlib1g-dev python3 python-is-python3 \
            p7zip-full unzip jq

      - name: "Download kernel artifact (same repo)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ker
          gh run download -R ${{ github.repository }} -n begonia-kernel -D ker $KERNEL_RUN_ID
          ls -lh ker/

      - name: "Download stock recovery (cross-repo)"
        run: |
          mkdir -p rec
          curl -sL -o rec/recovery.zip -w "HTTP %{http_code}\n" \
            -H "Authorization: Bearer $GH_PAT" \
            "https://api.github.com/repos/$RECOVERY_OTHER_REPO/actions/artifacts/$RECOVERY_ARTIFACT_ID/zip"
          unzip -o rec/recovery.zip -d rec/ && rm -f rec/recovery.zip
          ls -lh rec/recovery.img 2>/dev/null || { ls rec/; exit 1; }

      - name: "Unpack stock recovery"
        working-directory: ./editor
        run: |
          rm -f recovery.img *.img
          cp -v ../rec/recovery.img ./recovery.img
          ls -lh recovery.img
          file recovery.img
          ./gradlew unpack 2>&1 || {
            echo "Gradle unpack failed, trying direct..."
            java -jar ../example/bbootimg/bbootimg.jar unpack recovery.img build/unzip_boot/ 2>&1 || true
          }
          echo "=== Unpack result ==="
          ls build/unzip_boot/ 2>/dev/null || echo "No build/unzip_boot/"
          echo "---"
          ls build/unzip_boot/root/ 2>/dev/null && echo "root exists" || echo "no root"

      - name: "Check unpack result"
        run: |
          ls -la editor/build/unzip_boot/ 2>/dev/null || echo "No unpack dir"
          echo "---"
          # Check if root dir exists
          find editor/build/unzip_boot/ -maxdepth 2 -name "init.rc" -o -name "*.rc" 2>/dev/null | head -10
          echo "---"
          # Check kernel from unpack
          ls -lh editor/build/unzip_boot/kernel 2>/dev/null || echo "No kernel from unpack"
          echo "---"
          ls editor/build/unzip_boot/root/system/bin/ 2>/dev/null | head -5 || echo "no system/bin"

      - name: "Backup example repo mods"
        run: |
          mkdir -p /tmp/mods
          cd example
          for f in build/unzip_boot/root/system/bin/droidspaces \
            build/unzip_boot/root/system/bin/recovery-console \
            build/unzip_boot/root/system/bin/boot-ubuntu.sh \
            build/unzip_boot/root/system/bin/selinux-permissive \
            build/unzip_boot/root/system/etc/init/init.ubuntu-droidspaces.example.rc \
            build/unzip_boot/root/system/etc/environment \
            build/unzip_boot/root/system/etc/init/init.recovery.usb.rc; do
            [ -f "$f" ] && mkdir -p "/tmp/mods/$(dirname "$f")" && cp "$f" "/tmp/mods/$f" && echo "Saved: $f"
          done

      - name: "Inject DroidSpaces files into unpacked recovery"
        if: success()
        run: |
          ROOT=editor/build/unzip_boot/root
          MODS=/tmp/mods/build/unzip_boot/root
          if [ ! -d "$ROOT" ]; then
            echo "No root dir - skipping injection"
            exit 1
          fi
          for f in droidspaces recovery-console boot-ubuntu.sh selinux-permissive; do
            [ -f "$MODS/system/bin/$f" ] && cp -v "$MODS/system/bin/$f" "$ROOT/system/bin/" && chmod 755 "$ROOT/system/bin/$f" 2>/dev/null || true
          done
          cp -v "$MODS/system/etc/environment" "$ROOT/system/etc/" || true
          mkdir -p "$ROOT/system/etc/init"
          cp -v "$MODS/system/etc/init/init.recovery.usb.rc" "$ROOT/system/etc/init/" || true
          cp -v "$MODS/system/etc/init/init.ubuntu-droidspaces.example.rc" "$ROOT/system/etc/init/init.ubuntu-droidspaces.rc" || true
          echo "Injection done"
          ls -la "$ROOT/system/bin/droidspaces" "$ROOT/system/bin/recovery-console" 2>/dev/null

      - name: "Replace kernel"
        if: success()
        run: |
          mkdir -p ko
          tar -xzf ker/kernel.tar.gz -C ko/ 2>/dev/null || { echo "No kernel archive"; ls ker/; exit 1; }
          K=editor/build/unzip_boot/kernel
          for img in Image.gz-dtb Image.gz Image; do
            [ -f "ko/$img" ] && { cp "ko/$img" "$K"; echo "Kernel: $img ($(stat -c%s "$K") bytes)"; break; }
          done || { find ko/ -type f | head -10; exit 1; }

      - name: "Modify ramdisk"
        if: success()
        run: |
          R=editor/build/unzip_boot/root
          RC=$(find "$R" -name init.rc -path '*/etc/init*' | head -1)
          [ -f "$RC" ] && {
            cp "$RC" "$RC.bak"
            grep -q selinux-permissive "$RC" || {
              sed -i '/^on init/a\    start selinux-permissive' "$RC"
              printf '\nservice selinux-permissive /system/bin/selinux-permissive\n    class core\n    user root\n    group root\n    oneshot\n    seclabel u:r:recovery:s0\n' >> "$RC"
            }
            grep -q '^service recovery ' "$RC" && sed -i '/^service recovery /a\    disabled' "$RC"
            echo "init.rc done"
          }
          PF=$(find "$R" -name prop.default | head -1)
          [ -f "$PF" ] && {
            cp "$PF" "$PF.bak"
            for kv in 'ro.secure=0' 'ro.adb.secure=0' 'ro.debuggable=1' \
                      'service.adb.root=1' 'ro.force.debuggable=1'; do
              k="${kv%%=*}"; v="${kv#*=}"
              grep -q "^${k}=" "$PF" && sed -i "s/^${k}=.*/${k}=${v}/" "$PF" || echo "$kv" >> "$PF"
            done
            echo "prop.default done"
          }

      - name: "Repack"
        working-directory: ./editor
        if: success()
        run: |
          rm -f recovery.img.signed recovery.img.clear recovery.img.google
          ./gradlew pack 2>&1 || {
            echo "Gradle pack failed, trying bbootimg..."
            java -jar ../example/bbootimg/bbootimg.jar pack build/unzip_boot/ recovery.img.signed 2>&1 || true
          }
          [ -f recovery.img.signed ] && ls -lh recovery.img.signed || {
            [ -f recovery.img.clear ] && { cp recovery.img.clear recovery.img.signed; ls -lh recovery.img.signed; } || echo "No output"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: begonia-droidspaces-recovery
          path: editor/recovery.img.signed
          retention-days: 90

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: debug
          path: |
            editor/build/unzip_boot/
            editor/recovery.img.*
            ker/ rec/
          retention-days: 14
