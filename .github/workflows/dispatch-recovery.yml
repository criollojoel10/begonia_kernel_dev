name: "Dispatch DroidSpaces Recovery Hack"

on:
  push:
    branches: [ "droidspaces-recovery" ]

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Dispatch recovery hack workflow"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching droidspaces-recovery.yml..."
          gh workflow run droidspaces-recovery.yml \
            -R ${{ github.repository }} \
            --ref ${{ github.ref_name }} \
            -f kernel_run_id=28171150311 \
            -f stock_recovery_run_id=28147575684
