name: "Build DroidSpaces Kernel"

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || 'droidspaces' }}
          fetch-depth: 1
          path: kernel

      - name: Deps
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev cpio ccache perl python3 gcc-aarch64-linux-gnu device-tree-compiler lz4

      - name: Clang
        run: |
          mkdir clang
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz -O - | tar -xz -C clang
          clang/bin/clang --version | head -1

      - name: Config
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 ${{ inputs.defconfig || 'begonia_user_defconfig' }}
          scripts/config --file out/.config --enable NAMESPACES PID_NS NET_NS CGROUPS SECCOMP
          scripts/config --file out/.config --enable DEVTMPFS OVERLAY_FS VETH BRIDGE
          scripts/config --file out/.config --disable ANDROID_PARANOID_NETWORK
          make O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 olddefconfig
          grep "^CONFIG_NAMESPACES=\|^CONFIG_SECCOMP=\|^CONFIG_CGROUPS=\|^CONFIG_VETH=" out/.config

      - name: Build
        working-directory: kernel
        run: |
          export PATH=$GITHUB_WORKSPACE/clang/bin:$PATH
          make O=out ARCH=arm64 CC=clang LD=ld.lld CROSS_COMPILE=aarch64-linux-gnu- LLVM=1 -j$(nproc) Image.gz 2>&1 | tee build.log
          ls -lh out/arch/arm64/boot/

      - name: Package
        run: |
          d=kernel/out/arch/arm64/boot; mkdir output
          [ -f $d/Image.gz-dtb ] && cp $d/Image.gz-dtb output/
          [ -f $d/Image.gz ] && cp $d/Image.gz output/
          find kernel/out/arch/arm64/boot/dts -name "*.dtb" -exec cp {} output/ \;2>/dev/null || true
          cd output && tar -czf ../kernel.tar.gz . && ls -lh ../kernel.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: begonia-kernel
          path: kernel.tar.gz
